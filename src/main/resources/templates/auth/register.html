<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - Quản Lý Ngân Sách</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/fund-manager.css}" href="/css/fund-manager.css">
    <script defer th:src="@{/js/fund-manager.js}" src="/js/fund-manager.js"></script>
</head>
<body class="auth-page">
    <section th:replace="~{fragments/layout :: authStory}"></section>
    <main class="auth-form-panel" id="main-content">
    <div class="register-card">
        <div class="register-header">
            <div class="icon">
                <i class="fas fa-user-plus"></i>
            </div>
            <h2>Tạo tài khoản mới</h2>
            <p>Tham gia hệ thống quản lý ngân sách</p>
        </div>
        <!-- Hiển thị thông báo lỗi -->
        <div th:if="${error}" class="alert alert-danger" role="alert">
            <i class="fas fa-exclamation-triangle me-2"></i>
            <span th:text="${error}"></span>
        </div>
        <!-- Hiển thị thông báo thành công -->
        <div th:if="${success}" class="alert alert-success" role="alert">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${success}"></span>
        </div>
        <!-- Form đăng ký -->
        <form th:action="@{/auth/register}" th:object="${user}" method="post" id="registerForm" autocomplete="on">
            <label for="fullName" class="form-label"><i class="fas fa-id-card me-1"></i> Họ và tên</label>
            <input type="text" class="form-control" id="fullName" th:field="*{fullName}" placeholder="Nhập họ và tên" required>

            <label for="username" class="form-label"><i class="fas fa-user me-1"></i> Tên đăng nhập</label>
            <input type="text" class="form-control" id="username" th:field="*{username}" placeholder="Nhập tên đăng nhập" required minlength="3">

            <label for="email" class="form-label"><i class="fas fa-envelope me-1"></i> Email</label>
            <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="Nhập email" required>

            <label for="password" class="form-label"><i class="fas fa-lock me-1"></i> Mật khẩu</label>
            <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="Nhập mật khẩu" required minlength="6">

            <label for="confirmPassword" class="form-label"><i class="fas fa-lock me-1"></i> Xác nhận mật khẩu</label>
            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Nhập lại mật khẩu" required>

            <button type="submit" class="btn btn-register" id="registerBtn">
                <i class="fas fa-user-plus me-2"></i> Đăng ký
            </button>
        </form>
        <div class="login-link">
            <span>Đã có tài khoản?</span>
            <a th:href="@{/login}">
                <i class="fas fa-sign-in-alt me-1"></i> Đăng nhập ngay
            </a>
        </div>
    </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Simple password match check
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('registerForm');
            const password = document.getElementById('password');
            const confirmPassword = document.getElementById('confirmPassword');
            const btn = document.getElementById('registerBtn');

            function checkPasswordMatch() {
                if (confirmPassword.value !== password.value) {
                    confirmPassword.setCustomValidity('Mật khẩu xác nhận không khớp');
                } else {
                    confirmPassword.setCustomValidity('');
                }
            }

            password.addEventListener('input', checkPasswordMatch);
            confirmPassword.addEventListener('input', checkPasswordMatch);

            form.addEventListener('submit', function() {
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Đang đăng ký...';
            });

        });
    </script>
</body>
</html>
