<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Quản Lý Ngân Sách</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/fund-manager.css}" href="/css/fund-manager.css">
    <script defer th:src="@{/js/fund-manager.js}" src="/js/fund-manager.js"></script>
</head>
<body class="auth-page">
    <section th:replace="~{fragments/layout :: authStory}"></section>
    <main class="auth-form-panel" id="main-content">
    <div class="login-card">
        <div class="login-header">
            <div class="icon">
                <i class="fas fa-wallet"></i>
            </div>
            <h2>Chào mừng trở lại!</h2>
            <p>Đăng nhập vào hệ thống quản lý ngân sách</p>
        </div>
        <!-- Hiển thị thông báo lỗi -->
        <div th:if="${error}" class="alert alert-danger" role="alert">
            <i class="fas fa-exclamation-triangle me-2"></i>
            <span th:text="${error}"></span>
        </div>
        <!-- Hiển thị thông báo thành công -->
        <div th:if="${success}" class="alert alert-success" role="alert">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${success}"></span>
        </div>
        <!-- Form đăng nhập -->
        <form th:action="@{/login}" method="post" id="loginForm" autocomplete="on">
            <label for="username" class="form-label"><i class="fas fa-user me-1"></i> Tên đăng nhập</label>
            <input type="text" class="form-control" id="username" name="username" placeholder="Nhập tên đăng nhập" required>

            <label for="password" class="form-label"><i class="fas fa-lock me-1"></i> Mật khẩu</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Nhập mật khẩu" required>

            <label for="userType" class="form-label"><i class="fas fa-user-tag me-1"></i> Loại tài khoản</label>
            <select class="form-select" id="userType" name="userType">
                <option value="user" selected>Người dùng</option>
                <option value="admin">Quản trị viên</option>
            </select>

            <button type="submit" class="btn btn-login" id="loginBtn">
                <i class="fas fa-sign-in-alt me-2"></i> Đăng Nhập
            </button>
        </form>
        <div class="register-link">
            <span>Chưa có tài khoản?</span>
            <a th:href="@{/auth/register}">
                <i class="fas fa-user-plus me-1"></i> Đăng ký ngay
            </a>
        </div>
    </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Loading state for button
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('loginForm');
            const loginBtn = document.getElementById('loginBtn');
            form.addEventListener('submit', function() {
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Đang đăng nhập...';
            });
        });
    </script>
</body>
</html>
