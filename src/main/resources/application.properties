spring.application.name=quanlyngansach
server.address=0.0.0.0
server.port=8080
server.forward-headers-strategy=framework
spring.thymeleaf.cache=false

# ==================== DATABASE ====================
# Mật khẩu KHÔNG ghi trong file này. Lấy theo thứ tự:
#   1. Biến môi trường DB_PASSWORD
#   2. File local.properties ở thư mục gốc dự án (đã .gitignore), nội dung: DB_PASSWORD=...
spring.config.import=optional:file:./local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://mysql-367c7192-binmarket021-11ae.f.aivencloud.com:10418/defaultdb?useSSL=true&requireSSL=true&verifyServerCertificate=false}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP: DB cloud gói Free giới hạn kết nối và hay ngắt kết nối nhàn rỗi
spring.datasource.hikari.pool-name=HikariPool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
# Chờ tối đa 20 giây để lấy kết nối (trước là 5 phút làm trang bị treo khi DB tắt)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
# Định kỳ "ping" kết nối nhàn rỗi để không bị DB/mạng cắt ngầm
spring.datasource.hikari.keepalive-time=120000

# ==================== JPA & HIBERNATE ====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Cho phép template đọc quan hệ LAZY (vd. group.members) sau khi service trả về
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false
spring.jpa.open-in-view=true

spring.jpa.properties.hibernate.id.new_generator_mappings=false
spring.jpa.properties.hibernate.schema_update.unique_naming_strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
