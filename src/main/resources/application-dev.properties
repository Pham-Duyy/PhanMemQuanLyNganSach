# ==================== CHẾ ĐỘ CHẠY THỬ (profile "dev") ====================
# Dùng database H2 trong bộ nhớ thay cho MySQL Aiven: không cần mạng, không cần mật khẩu.
# Dữ liệu mẫu do DevDataSeeder tạo khi khởi động và MẤT khi tắt app.
# Chạy: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
spring.datasource.url=jdbc:h2:mem:fundmanager;MODE=MySQL;LOCK_TIMEOUT=10000;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
